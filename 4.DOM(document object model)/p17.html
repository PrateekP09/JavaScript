<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>requestFullScreen and exitFullScreen</h1>
    <button id="fs">Full Screen</button>

    <script>
        let fsBtn = document.getElementById("fs")
        let status = document.getElementById("status")
        fsBtn.onclick =function(){
            if(document.fullscreenElement){
                document.exitFullscreen().then(res => {
                    console.log('document has exit from full screen')
                    fsBtn.innerText ='Énter fullscreen';
                }).catch(err=> console.log(err.message))
            }else{
                document.documentElement.requestFullscreen().then(res=> {
                    status.innerText = 'document entered into full screen'
                    fsBtn.innerText ='exit fullscreen';

                }).catch(err=> console.log(err.message))
            }
            
        }
    </script>
</body>
</html>
