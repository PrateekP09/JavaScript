<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: green;
        }
        .circle{
            background-color: lightblue;
        }
    </style>
</head>
<body>
   <h1>Class List</h1> 

   <div></div>

   <button onclick="addhandler()">Add Class</button>
   <button onclick="removehandler()">Remove Class</button>
   <button onclick="togglehandler()">Toggle Class</button>

   <script>
    let blk= document.querySelector("div")
    function addhandler(){
        blk.classList.add("circle")
    }
    function removehandler(){
        blk.classList.remove("circle")
    }
    function togglehandler(){
        blk.classList.toggle("circle");
    }
   </script>
</body>
</html>
